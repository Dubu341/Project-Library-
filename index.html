<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="script.js"></script>
  </head>
  <body>
    <dialog>
      <form action="" method="dialog" id="bookForm">
        <label for="title">
          ><span>Title:</span>
          <span class="titleError error" aria-live="polite"></span
        ></label>
        <input
          type="text"
          id="title"
          name="title"
          maxlength="32"
          autofocus
          required
        />
        <label for="author">
          <span>Author:</span>
          <span class="authorError error" aria-live="polite"></span>
        </label>
        <input type="text" id="author" name="author" required />
        <label for="pages"
          ><span>Number of pages:</span
          ><span class="pagesError error" aria-live="polite"></span>
        </label>
        <input
          type="number"
          min="1"
          oninput="this.value = this.value.replace(/[^0-9]/g, '')"
          name="pages"
          id="pages"
        />
        <label for="readStatus"
          >Has it been read?
          <input class="checkbox" type="checkbox" id="readStatus" name="read" />
        </label>
      </form>
      <div class="dialogBtns">
        <button class="closeBtn">Close</button>
        <button class="confirm" form="bookForm">Add</button>
      </div>
    </dialog>

    <div class="container">
      <button class="addBookBtn" type="submit">Add a book</button>
      <div class="card-container"></div>
    </div>
  </body>
</html>
